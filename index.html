<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#020912"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<title>JARVIS AI</title>


<style>

/* =========================================================
   BASE
========================================================= */

:root{
    --cyan:#00eaff;
    --blue:#147bff;
    --bg:#020912;
    --panel:rgba(3,20,31,.72);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--cyan);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(0,234,255,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(20,123,255,.08),
            transparent 40%
        ),
        #020912;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.22;

    background-image:
        linear-gradient(
            rgba(0,234,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,234,255,.08) 1px,
            transparent 1px
        );

    background-size:34px 34px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            #000 15%,
            #000 85%,
            transparent
        );
}


/* =========================================================
   APP
========================================================= */

.app{
    height:100%;
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
}


/* =========================================================
   TOP
========================================================= */

.top{
    position:absolute;
    top:22px;
    left:20px;
    right:20px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    z-index:5;
}

.brand{
    font-size:27px;
    letter-spacing:8px;
    font-weight:300;

    text-shadow:
        0 0 16px var(--cyan);
}

.sub{
    font-size:9px;
    letter-spacing:3px;
    margin-top:5px;
    opacity:.65;
}

.clock{
    text-align:right;
    font-size:11px;
    letter-spacing:2px;
    opacity:.75;
}


/* =========================================================
   STATO
========================================================= */

.status{
    position:absolute;
    top:92px;

    text-align:center;

    z-index:5;

    font-size:12px;
    letter-spacing:4px;

    text-shadow:
        0 0 12px var(--cyan);
}

.status .dot{
    display:inline-block;

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 12px var(--cyan);

    margin-right:9px;
}


/* =========================================================
   NEURAL CORE
========================================================= */

.hud{
    position:absolute;

    top:50%;
    left:50%;

    width:310px;
    height:310px;

    transform:
        translate(-50%,-49%);

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =========================================================
   RINGS
========================================================= */

.ring,
.ring2,
.ring3,
.ring4{
    position:absolute;
    border-radius:50%;

    border:
        1px solid
        rgba(0,234,255,.42);
}

.ring{
    width:285px;
    height:285px;

    border-style:dashed;

    animation:
        spin
        18s
        linear
        infinite;
}

.ring2{
    width:240px;
    height:240px;

    border-color:
        rgba(20,123,255,.7);

    border-top-color:
        transparent;

    border-bottom-color:
        transparent;

    animation:
        spinBack
        10s
        linear
        infinite;
}

.ring3{
    width:190px;
    height:190px;

    border:
        2px solid
        rgba(0,234,255,.38);

    border-left-color:
        transparent;

    border-right-color:
        transparent;

    animation:
        spin
        7s
        linear
        infinite;
}

.ring4{
    width:138px;
    height:138px;

    border:
        1px solid
        rgba(0,234,255,.8);

    box-shadow:
        0 0 28px
        rgba(0,234,255,.16),

        inset 0 0 22px
        rgba(0,234,255,.12);
}


/* =========================================================
   TICK
========================================================= */

.tick{
    position:absolute;

    width:300px;
    height:300px;

    border-radius:50%;

    animation:
        spinBack
        25s
        linear
        infinite;
}

.tick:before,
.tick:after{
    content:"";

    position:absolute;

    left:50%;
    top:-4px;

    width:2px;
    height:20px;

    background:var(--cyan);

    box-shadow:
        0 290px 0 var(--cyan);
}

.tick:after{
    transform:
        rotate(90deg);

    transform-origin:
        1px 154px;
}


/* =========================================================
   CORE
========================================================= */

.core{
    width:74px;
    height:74px;

    border-radius:50%;

    position:relative;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95) 0 3%,
            rgba(0,234,255,.95) 7%,
            rgba(0,234,255,.25) 34%,
            transparent 68%
        );

    box-shadow:
        0 0 25px var(--cyan),
        0 0 65px rgba(0,234,255,.35);

    animation:
        pulse
        2.2s
        ease-in-out
        infinite;
}

.core:before,
.core:after{
    content:"";

    position:absolute;

    inset:17px;

    border:
        1px solid
        var(--cyan);

    border-radius:50%;
}

.core:after{
    inset:27px;

    border-color:white;

    opacity:.7;
}


/* =========================================================
   SCAN
========================================================= */

.scan{
    position:absolute;

    width:250px;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--cyan),
            transparent
        );

    box-shadow:
        0 0 10px var(--cyan);

    animation:
        scan
        4s
        ease-in-out
        infinite;
}


/* =========================================================
   PARTICELLE
========================================================= */

#neural span{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:var(--cyan);

    box-shadow:
        0 0 8px var(--cyan);

    animation:
        particle
        3s
        ease-in-out
        infinite alternate;
}


/* =========================================================
   INFO
========================================================= */

.info{
    position:absolute;

    bottom:105px;
    left:18px;
    right:18px;

    display:grid;

    grid-template-columns:
        1fr 1fr 1fr;

    gap:8px;

    z-index:5;
}

.panel{
    border:
        1px solid
        rgba(0,234,255,.28);

    background:
        var(--panel);

    padding:
        10px 8px;

    min-height:52px;

    box-shadow:
        inset 0 0 15px
        rgba(0,234,255,.03);
}

.label{
    font-size:8px;
    letter-spacing:2px;
    opacity:.55;
}

.value{
    font-size:11px;
    letter-spacing:1px;
    margin-top:7px;
}


/* =========================================================
   MICROFONO
========================================================= */

.bottom{
    position:absolute;

    bottom:25px;
    left:0;
    right:0;

    display:flex;
    justify-content:center;

    z-index:10;
}

.mic{
    width:70px;
    height:70px;

    border-radius:50%;

    border:
        1px solid
        var(--cyan);

    background:
        rgba(0,234,255,.05);

    color:var(--cyan);

    font-size:24px;

    box-shadow:
        0 0 22px
        rgba(0,234,255,.18);

    transition:.2s;
}

.mic.active{
    background:
        rgba(0,234,255,.18);

    box-shadow:
        0 0 35px
        rgba(0,234,255,.65);

    transform:
        scale(1.08);
}


/* =========================================================
   FOOTER
========================================================= */

.footer{
    position:absolute;

    bottom:5px;

    font-size:7px;

    letter-spacing:2px;

    opacity:.35;
}


/* =========================================================
   ANIMAZIONI
========================================================= */

@keyframes spin{
    to{
        transform:
            rotate(360deg);
    }
}

@keyframes spinBack{
    to{
        transform:
            rotate(-360deg);
    }
}

@keyframes pulse{
    50%{
        transform:
            scale(1.12);

        filter:
            brightness(1.3);
    }
}

@keyframes scan{

    0%,
    100%{
        transform:
            translateY(-100px);

        opacity:0;
    }

    20%,
    80%{
        opacity:.75;
    }

    50%{
        transform:
            translateY(100px);
    }
}

@keyframes particle{

    from{
        transform:
            scale(.6);

        opacity:.35;
    }

    to{
        transform:
            scale(1.5);

        opacity:1;
    }
}


/* =========================================================
   SCHERMI PICCOLI
========================================================= */

@media(max-height:650px){

    .hud{
        transform:
            translate(-50%,-48%)
            scale(.82);
    }

    .info{
        bottom:82px;
    }

    .bottom{
        bottom:8px;
    }

    .status{
        top:78px;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         TESTATA
    ====================================================== -->

    <div class="top">

        <div>

            <div class="brand">
                JARVIS
            </div>

            <div class="sub">
                PERSONAL AI SYSTEM
            </div>

        </div>


        <div
            class="clock"
            id="clock"
        >
            --:--:--
            <br>
            LOCAL SYSTEM
        </div>

    </div>


    <!-- =====================================================
         STATO
    ====================================================== -->

    <div class="status">

        <span
            class="dot"
            id="dot"
        ></span>

        <span id="status">
            SYSTEM READY
        </span>

    </div>


    <!-- =====================================================
         NEURAL CORE
    ====================================================== -->

    <div
        class="hud"
        id="neural"
    >

        <div class="ring"></div>

        <div class="ring2"></div>

        <div class="ring3"></div>

        <div class="ring4"></div>

        <div class="tick"></div>

        <div class="scan"></div>

        <div class="core"></div>

    </div>


    <!-- =====================================================
         INFORMAZIONI
    ====================================================== -->

    <div class="info">

        <div class="panel">

            <div class="label">
                SYSTEM
            </div>

            <div class="value">
                ONLINE
            </div>

        </div>


        <div class="panel">

            <div class="label">
                MEMORY
            </div>

            <div class="value">
                LOCAL
            </div>

        </div>


        <div class="panel">

            <div class="label">
                MIC
            </div>

            <div
                class="value"
                id="voice"
            >
                STANDBY
            </div>

        </div>

    </div>


    <!-- =====================================================
         MICROFONO
    ====================================================== -->

    <div class="bottom">

        <button
            class="mic"
            id="mic"
            aria-label="Attiva JARVIS"
        >
            ◉
        </button>

    </div>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div class="footer">
        JARVIS AI // LOCAL INTERFACE
    </div>


</div>


<script>

/* =========================================================
   ELEMENTI
========================================================= */

const statusElement =
    document.getElementById("status");

const voiceElement =
    document.getElementById("voice");

const mic =
    document.getElementById("mic");

const neural =
    document.getElementById("neural");

const clock =
    document.getElementById("clock");


/* =========================================================
   PARTICELLE
========================================================= */

for(let i = 0; i < 40; i++){

    const p =
        document.createElement("span");

    const angle =
        Math.random() *
        Math.PI *
        2;

    const radius =
        35 +
        Math.random() *
        55;

    p.style.left =
        (
            50 +
            Math.cos(angle) *
            radius /
            1.8
        ) + "%";

    p.style.top =
        (
            50 +
            Math.sin(angle) *
            radius /
            1.8
        ) + "%";

    neural.appendChild(p);

}


/* =========================================================
   OROLOGIO
========================================================= */

function updateClock(){

    const d =
        new Date();

    const h =
        String(
            d.getHours()
        ).padStart(2,"0");

    const m =
        String(
            d.getMinutes()
        ).padStart(2,"0");

    const s =
        String(
            d.getSeconds()
        ).padStart(2,"0");

    clock.innerHTML =
        h + ":" +
        m + ":" +
        s +
        "<br>LOCAL SYSTEM";

}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   STATO JARVIS
========================================================= */

function setState(text){

    statusElement.textContent =
        text;

    voiceElement.textContent =
        text;

    if(

        text === "LISTENING" ||
        text === "HEARING" ||
        text === "THINKING" ||
        text === "SPEAKING"

    ){

        mic.classList.add(
            "active"
        );

    }else{

        mic.classList.remove(
            "active"
        );

    }

}


/* =========================================================
   RICONOSCIMENTO VOCALE
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let listening = false;


/* =========================================================
   SELEZIONE VOCE ITALIANA
========================================================= */

let italianVoice = null;


function loadVoices(){

    const voices =
        speechSynthesis.getVoices();

    if(!voices.length){
        return;
    }


    const italianVoices =
        voices.filter(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("it")
        );


    if(!italianVoices.length){
        return;
    }


    /*
     * Proviamo a trovare una voce maschile.
     */

    const maleKeywords = [

        "male",
        "maschile",
        "man",
        "uomo",
        "stefano",
        "luca",
        "giorgio",
        "marco",
        "paolo",
        "riccardo",
        "mattia",
        "davide"

    ];


    const maleVoice =
        italianVoices.find(
            voice => {

                const name =
                    voice.name
                        .toLowerCase();

                return maleKeywords.some(
                    keyword =>
                        name.includes(keyword)
                );

            }
        );


    if(maleVoice){

        italianVoice =
            maleVoice;

    }else{

        italianVoice =
            italianVoices.find(
                voice =>
                    voice.localService
            ) ||
            italianVoices[0];

    }


    console.log(
        "VOCE SELEZIONATA:",
        italianVoice.name
    );

}


loadVoices();


if(
    "speechSynthesis" in window
){

    speechSynthesis.onvoiceschanged =
        loadVoices;

}


/* =========================================================
   RICONOSCIMENTO SALUTO
========================================================= */

function isJarvisGreeting(testo){

    const t =
        testo
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .replace(
                /[^a-z0-9\s]/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    console.log(
        "TESTO NORMALIZZATO:",
        t
    );


    /*
     * Basta che venga pronunciato JARVIS.
     */

    if(
        t.includes("jarvis")
    ){

        return true;

    }


    /*
     * Alcuni riconoscimenti vocali
     * possono storpiare leggermente il nome.
     */

    if(
        t.includes("jarvis") ||
        t.includes("jarvis") ||
        t.includes("jarvis")
    ){

        return true;

    }


    return false;

}


/* =========================================================
   FRASE THINKING
========================================================= */

function getThinkingPhrase(testo){

    const t =
        testo
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            )
            .trim();


    console.log(
        "TESTO ANALIZZATO:",
        t
    );


    /* =====================================================
       JARVIS
    ===================================================== */

    if(
        isJarvisGreeting(testo)
    ){

        return "Salve, signore. Come posso esserle utile?";

    }


    /* =====================================================
       TEMPERATURA / METEO
    ===================================================== */

    if(

        t.includes("temperatura") ||
        t.includes("gradi") ||
        t.includes("meteo") ||
        t.includes("tempo fa") ||
        t.includes("che tempo") ||
        t.includes("quanto fa caldo") ||
        t.includes("quanto fa freddo")

    ){

        return "Sto verificando la temperatura attuale, signore.";

    }


    /* =====================================================
       ORA
    ===================================================== */

    if(

        t.includes("che ore") ||
        t.includes("che ora") ||
        t.includes("orario")

    ){

        return "Sto verificando l'ora attuale, signore.";

    }


    /* =====================================================
       CALENDARIO
    ===================================================== */

    if(

        t.includes("calendario") ||
        t.includes("appuntamento") ||
        t.includes("agenda")

    ){

        return "Sto controllando la sua agenda, signore.";

    }


    /* =====================================================
       MEMORIA
    ===================================================== */

    if(

        t.includes("ricorda") ||
        t.includes("ricordami") ||
        t.includes("memoria") ||
        t.includes("ricordi")

    ){

        return "Sto verificando la memoria, signore.";

    }


    /* =====================================================
       RICERCA
    ===================================================== */

    if(

        t.includes("cerca") ||
        t.includes("trova") ||
        t.includes("informazioni") ||
        t.includes("chi e") ||
        t.includes("cos e") ||
        t.includes("cosa e")

    ){

        return "Sto cercando le informazioni richieste, signore.";

    }


    /* =====================================================
       GENERALE
    ===================================================== */

    return "Sto elaborando la richiesta, signore.";

}


/* =========================================================
   VOCE JARVIS
========================================================= */

function speak(text){

    console.log(
        "JARVIS SPEAK:",
        text
    );


    setState(
        "SPEAKING"
    );


    if(
        !("speechSynthesis" in window)
    ){

        setState(
            "VOICE ERROR"
        );

        alert(
            "La sintesi vocale non è disponibile."
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    if(italianVoice){

        utterance.voice =
            italianVoice;

    }


    /*
     * Voce più lenta e meno acuta.
     */

    utterance.rate =
        0.88;

    utterance.pitch =
        0.82;

    utterance.volume =
        1;


    utterance.onstart =
        function(){

            setState(
                "SPEAKING"
            );

        };


    utterance.onend =
        function(){

            setState(
                "SYSTEM READY"
            );

        };


    utterance.onerror =
        function(event){

            console.log(
                "ERRORE VOCE:",
                event
            );

            setState(
                "VOICE ERROR"
            );

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   ASCOLTO
========================================================= */

function startListening(){

    console.log(
        "PULSANTE JARVIS PREMUTO"
    );


    if(listening){

        return;

    }


    if(!SpeechRecognition){

        setState(
            "VOICE ERROR"
        );

        alert(
            "Il browser non supporta il riconoscimento vocale."
        );

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "it-IT";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        3;


    /* =====================================================
       START
    ===================================================== */

    recognition.onstart =
        function(){

            listening =
                true;

            setState(
                "LISTENING"
            );

        };


    /* =====================================================
       AUDIO
    ===================================================== */

    recognition.onaudiostart =
        function(){

            setState(
                "HEARING"
            );

        };


    /* =====================================================
       PARLATO
    ===================================================== */

    recognition.onspeechstart =
        function(){

            setState(
                "LISTENING"
            );

        };


    /* =====================================================
       RISULTATO
    ===================================================== */

    recognition.onresult =
        function(event){

            console.log(
                "RISULTATO RICEVUTO"
            );


            let testo =
                "";


            /*
             * Controlliamo tutte le alternative
             * disponibili.
             */

            for(
                let i = 0;
                i < event.results[0].length;
                i++
            ){

                const alternativa =
                    event.results[0][i].transcript;

                console.log(
                    "ALTERNATIVA:",
                    alternativa
                );


                /*
                 * Se una delle alternative contiene
                 * JARVIS, utilizziamo quella.
                 */

                if(
                    alternativa
                        .toLowerCase()
                        .includes("jarvis")
                ){

                    testo =
                        alternativa;

                    break;

                }


                /*
                 * Altrimenti utilizziamo
                 * la prima alternativa.
                 */

                if(
                    i === 0
                ){

                    testo =
                        alternativa;

                }

            }


            console.log(
                "TESTO FINALE:",
                testo
            );


            listening =
                false;


            setState(
                "THINKING"
            );


            const response =
                getThinkingPhrase(
                    testo
                );


            console.log(
                "RISPOSTA:",
                response
            );


            setTimeout(
                function(){

                    speak(
                        response
                    );

                },
                500
            );

        };


    /* =====================================================
       NESSUN RISULTATO
    ===================================================== */

    recognition.onnomatch =
        function(){

            listening =
                false;

            setState(
                "NO COMMAND"
            );


            setTimeout(
                function(){

                    setState(
                        "SYSTEM READY"
                    );

                },
                2000
            );

        };


    /* =====================================================
       ERRORE
    ===================================================== */

    recognition.onerror =
        function(event){

            console.log(
                "ERRORE RICONOSCIMENTO:",
                event.error
            );


            listening =
                false;


            setState(
                "ERROR " +
                event.error.toUpperCase()
            );


            setTimeout(
                function(){

                    setState(
                        "SYSTEM READY"
                    );

                },
                3000
            );

        };


    /* =====================================================
       FINE
    ===================================================== */

    recognition.onend =
        function(){

            listening =
                false;


            if(

                statusElement.textContent ===
                "LISTENING" ||

                statusElement.textContent ===
                "HEARING"

            ){

                setState(
                    "SYSTEM READY"
                );

            }

        };


    /* =====================================================
       AVVIO
    ===================================================== */
