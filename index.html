<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color"
      content="#020b16">

<meta name="mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<title>JARVIS AI</title>


<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #06233d 0%,
            #020b16 45%,
            #000308 100%
        );

    color:#00eaff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   APP
===================================================== */

.app{

    width:100%;
    height:100%;

    position:relative;

    display:flex;
    flex-direction:column;

    align-items:center;

    overflow:hidden;
}


/* =====================================================
   TOP
===================================================== */

.top{

    width:100%;

    padding:
        18px
        20px
        10px;

    display:flex;

    justify-content:space-between;
    align-items:center;

    position:relative;

    z-index:20;
}


.logo{

    font-size:18px;

    font-weight:bold;

    letter-spacing:4px;

    text-shadow:
        0 0 8px #00eaff,
        0 0 18px #008cff;
}


.clock{

    font-size:15px;

    letter-spacing:2px;

    color:#8eefff;

    text-shadow:
        0 0 8px #00eaff;
}


/* =====================================================
   STATUS
===================================================== */

.status{

    margin-top:8px;

    font-size:13px;

    letter-spacing:3px;

    text-transform:uppercase;

    color:#00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 20px #0077ff;

    transition:
        color .3s,
        text-shadow .3s;
}


.status.listening{

    color:#00ff9d;

    text-shadow:
        0 0 8px #00ff9d,
        0 0 20px #00ff9d;
}


.status.thinking{

    color:#ffe600;

    text-shadow:
        0 0 8px #ffe600,
        0 0 20px #ff9900;
}


.status.speaking{

    color:#00eaff;

    text-shadow:
        0 0 8px #00eaff,
        0 0 25px #008cff;
}


/* =====================================================
   HUD
===================================================== */

.hud{

    position:absolute;

    width:100%;
    height:100%;

    pointer-events:none;

    opacity:.5;
}


.hud:before{

    content:"";

    position:absolute;

    top:50%;
    left:50%;

    width:90vw;
    height:90vw;

    max-width:600px;
    max-height:600px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(0,234,255,.18);

    border-radius:50%;

    box-shadow:

        0 0 40px
        rgba(0,234,255,.08),

        inset 0 0 40px
        rgba(0,234,255,.05);
}


/* =====================================================
   CENTRO
===================================================== */

.center{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:300px;
    height:300px;

    display:flex;

    justify-content:center;
    align-items:center;
}


/* =====================================================
   ANELLI
===================================================== */

.ring{

    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(0,234,255,.6);

    box-shadow:
        0 0 12px
        rgba(0,234,255,.2);
}


.ring1{

    width:260px;
    height:260px;

    animation:
        rotate 18s linear infinite;
}


.ring2{

    width:220px;
    height:220px;

    border-style:dashed;

    animation:
        rotateReverse 12s linear infinite;
}


.ring3{

    width:175px;
    height:175px;

    border:
        2px solid
        rgba(0,234,255,.65);

    animation:
        pulse 3s ease-in-out infinite;
}


@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}


@keyframes rotateReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }
}


@keyframes pulse{

    0%,100%{

        transform:scale(1);

        opacity:.6;
    }

    50%{

        transform:scale(1.08);

        opacity:1;
    }
}


/* =====================================================
   NEURAL CORE
===================================================== */

.neural{

    position:absolute;

    width:110px;
    height:110px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;
}


.core{

    width:65px;
    height:65px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #ffffff 0%,
            #00eaff 18%,
            #0077ff 45%,
            #001d3d 75%,
            transparent 100%
        );

    box-shadow:

        0 0 15px #00eaff,
        0 0 35px #008cff,
        0 0 70px rgba(0,140,255,.7);

    animation:
        corePulse 2s ease-in-out infinite;
}


@keyframes corePulse{

    0%,100%{

        transform:scale(.9);

        opacity:.8;
    }

    50%{

        transform:scale(1.08);

        opacity:1;
    }
}


/* =====================================================
   PARTICELLE
===================================================== */

.neural span{

    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#00eaff;

    box-shadow:
        0 0 8px #00eaff;

    animation:
        particle 3s linear infinite;
}


.neural span:nth-child(1){
    top:5%;
    left:50%;
}

.neural span:nth-child(2){
    top:25%;
    left:90%;
}

.neural span:nth-child(3){
    top:70%;
    left:95%;
}

.neural span:nth-child(4){
    top:95%;
    left:50%;
}

.neural span:nth-child(5){
    top:75%;
    left:10%;
}

.neural span:nth-child(6){
    top:25%;
    left:5%;
}


@keyframes particle{

    0%{

        transform:scale(.5);

        opacity:.2;
    }

    50%{

        transform:scale(1.5);

        opacity:1;
    }

    100%{

        transform:scale(.5);

        opacity:.2;
    }
}


/* =====================================================
   SCAN
===================================================== */

.scan{

    position:absolute;

    width:150px;
    height:1px;

    background:#00eaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff;

    animation:
        scan 3s ease-in-out infinite;
}


@keyframes scan{

    0%,100%{

        transform:
            translateY(-70px);

        opacity:0;
    }

    20%{
        opacity:1;
    }

    50%{

        transform:
            translateY(70px);

        opacity:1;
    }

    80%{
        opacity:0;
    }
}


/* =====================================================
   PULSANTE MICROFONO
===================================================== */

.mic{

    position:absolute;

    bottom:50px;

    width:78px;
    height:78px;

    border-radius:50%;

    border:
        1px solid
        rgba(0,234,255,.8);

    background:

        radial-gradient(
            circle,
            rgba(0,234,255,.18),
            rgba(0,50,80,.45)
        );

    box-shadow:

        0 0 15px
        rgba(0,234,255,.4),

        inset 0 0 20px
        rgba(0,234,255,.1);

    color:#00eaff;

    font-size:28px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:30;

    transition:
        transform .2s,
        box-shadow .2s;
}


.mic:active{

    transform:scale(.92);

    box-shadow:

        0 0 30px
        rgba(0,234,255,.8);
}


.mic.listening{

    border-color:#00ff9d;

    color:#00ff9d;

    box-shadow:

        0 0 20px #00ff9d,
        0 0 45px rgba(0,255,157,.5);

    animation:
        micPulse 1s infinite;
}


@keyframes micPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}


/* =====================================================
   PANNELLI
===================================================== */

.panel{

    position:absolute;

    width:135px;

    padding:8px 10px;

    border:
        1px solid
        rgba(0,234,255,.25);

    background:
        rgba(0,20,35,.35);

    font-size:9px;

    letter-spacing:1.5px;

    color:#55dff5;

    text-transform:uppercase;
}


.panel.left{

    left:12px;

    bottom:145px;
}


.panel.right{

    right:12px;

    bottom:145px;
}


.panel strong{

    display:block;

    color:#00eaff;

    margin-bottom:3px;
}


/* =====================================================
   TESTO VOCALE
===================================================== */

.voice{

    position:absolute;

    bottom:135px;

    width:90%;

    text-align:center;

    min-height:24px;

    font-size:13px;

    letter-spacing:1px;

    color:#baf7ff;

    text-shadow:
        0 0 8px
        rgba(0,234,255,.8);

    z-index:20;
}


/* =====================================================
   DISPLAY PICCOLO
===================================================== */

@media(max-height:700px){

    .center{

        transform:
            translate(-50%,-52%)
            scale(.82);
    }

    .mic{

        bottom:25px;
    }

    .voice{

        bottom:110px;
    }

    .panel{

        bottom:100px;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- TOP -->

    <div class="top">

        <div class="logo">
            JARVIS
        </div>

        <div
            class="clock"
            id="clock">

            --:--

        </div>

    </div>


    <!-- STATUS -->

    <div
        class="status"
        id="status">

        SYSTEM ONLINE

    </div>


    <!-- HUD -->

    <div class="hud"></div>


    <!-- CENTRO -->

    <div class="center">

        <div class="ring ring1"></div>

        <div class="ring ring2"></div>

        <div class="ring ring3"></div>


        <div
            class="neural"
            id="neural">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

            <div class="core"></div>

        </div>


        <div class="scan"></div>

    </div>


    <!-- TESTO -->

    <div
        class="voice"
        id="voice">

    </div>


    <!-- PANNELLI -->

    <div class="panel left">

        <strong>SYSTEM</strong>

        ONLINE

    </div>


    <div class="panel right">

        <strong>MEMORY</strong>

        LOCAL

    </div>


    <!-- MICROFONO -->

    <button
        class="mic"
        id="mic"
        aria-label="Attiva JARVIS">

        🎙

    </button>


</div>



<script>

/* =====================================================
   OROLOGIO
===================================================== */

function updateClock(){

    const now =
        new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(2,"0");

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2,"0");

    document
        .getElementById("clock")
        .textContent =
        hours + ":" + minutes;
}


updateClock();


setInterval(
    updateClock,
    1000
);



/* =====================================================
   ELEMENTI
===================================================== */

const mic =
    document.getElementById("mic");

const status =
    document.getElementById("status");

const voiceText =
    document.getElementById("voice");



/* =====================================================
   STATO
===================================================== */

function setState(state){

    status.className =
        "status";

    mic.classList.remove(
        "listening"
    );


    if(state === "LISTENING"){

        status.textContent =
            "LISTENING";

        status.classList.add(
            "listening"
        );

        mic.classList.add(
            "listening"
        );

    }


    else if(state === "THINKING"){

        status.textContent =
            "THINKING";

        status.classList.add(
            "thinking"
        );

    }


    else if(state === "SPEAKING"){

        status.textContent =
            "SPEAKING";

        status.classList.add(
            "speaking"
        );

    }


    else{

        status.textContent =
            "SYSTEM ONLINE";

    }

}



/* =====================================================
   VOCE ITALIANA
===================================================== */

let italianVoice = null;


function loadVoices(){

    const voices =
        speechSynthesis.getVoices();


    if(!voices.length){

        return;

    }


    const italianVoices =
        voices.filter(

            voice =>

                voice.lang &&

                voice.lang
                    .toLowerCase()
                    .startsWith("it")

        );


    if(!italianVoices.length){

        return;

    }


    /*
       Cerchiamo prima una voce
       che sembri maschile.
    */

    const maleKeywords = [

        "male",
        "maschile",
        "man",
        "uomo",
        "stefano",
        "luca",
        "giorgio",
        "marco",
        "paolo",
        "riccardo",
        "mattia",
        "davide"

    ];


    const maleVoice =
        italianVoices.find(

            voice => {

                const name =
                    voice.name
                        .toLowerCase();

                return maleKeywords.some(

                    keyword =>
                        name.includes(
                            keyword
                        )

                );

            }

        );


    if(maleVoice){

        italianVoice =
            maleVoice;

    }

    else{

        /*
           Se non troviamo una voce
           maschile identificabile,
           scegliamo quella locale.
        */

        italianVoice =

            italianVoices.find(

                voice =>
                    voice.localService

            )

            ||

            italianVoices[0];

    }


    console.log(
        "VOCE JARVIS:",
        italianVoice.name
    );

}


loadVoices();


if("speechSynthesis" in window){

    speechSynthesis.onvoiceschanged =
        loadVoices;

}



/* =====================================================
   JARVIS PARLA
===================================================== */

function speak(text){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    setState(
        "SPEAKING"
    );


    /*
       Il testo NON viene mostrato
       sullo schermo.
    */

    voiceText.textContent =
        "";


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "it-IT";


    if(italianVoice){

        utterance.voice =
            italianVoice;

    }


    /*
       Parametri JARVIS.
    */

    utterance.rate =
        1.08;

    utterance.pitch =
        0.82;

    utterance.volume =
        1;


    utterance.onend =
        function(){

            setState(
                "IDLE"
            );

        };


    utterance.onerror =
        function(){

            setState(
                "IDLE"
            );

        };


    speechSynthesis.speak(
        utterance
    );

}



/* =====================================================
   RICONOSCIMENTO VOCALE
===================================================== */

const SpeechRecognition =

    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition = null;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.lang =
        "it-IT";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;



    /* =================================================
       MICROFONO ATTIVO
    ================================================= */

    recognition.onstart =
        function(){

            console.log(
                "MICROFONO ATTIVO"
            );


            setState(
                "LISTENING"
            );


            voiceText.textContent =
                "";

        };



    /* =================================================
       RISULTATO
    ================================================= */

    recognition.onresult =
        function(event){

            console.log(
                "RISULTATO RICEVUTO"
            );


            const testo =
                event
                    .results[0][0]
                    .transcript;


            console.log(
                "TESTO RICONOSCIUTO:",
                testo
            );


            /*
               NON mostriamo il testo
               riconosciuto.
            */

            voiceText.textContent =
                "";


            setState(
                "THINKING"
            );


            /* =========================================
               NORMALIZZAZIONE
            ========================================= */

            const t =
                testo

                    .toLowerCase()

                    .normalize("NFD")

                    .replace(
                        /[\u0300-\u036f]/g,
                        ""
                    )

                    .trim();


            console.log(
                "TESTO NORMALIZZATO:",
                t
            );



            /* =========================================
               SALUTO
            ========================================= */

            if(

                t.includes("ciao") ||

                t.includes("salve") ||

                t.includes("buongiorno") ||

                t.includes("buonasera") ||

                t.includes("ehi") ||

                t.includes("hey") ||

                t.includes("jarvis")

            ){

                console.log(
                    "SALUTO JARVIS RICONOSCIUTO"
                );


                setTimeout(

                    function(){

                        speak(
                            "Salve signore Come posso esserle utile?"
                        );

                    },

                    500

                );


                return;

            }



            /* =========================================
               TEMPERATURA / METEO
            ========================================= */

            if(

                t.includes("temperatura") ||

                t.includes("gradi") ||

                t.includes("meteo") ||

                t.includes("che tempo") ||

                t.includes("quanto fa caldo") ||

                t.includes("quanto fa freddo")

            ){

                setTimeout(

                    function(){

                        speak(
                            "Sto verificando la temperatura attuale, signore."
                        );

                    },

                    500

                );


                return;

            }



            /* =========================================
               ORA
            ========================================= */

            if(

                t.includes("che ora") ||

                t.includes("che ore") ||

                t.includes("orario")

            ){

                setTimeout(

                    function(){

                        speak(
                            "Sto verificando l'ora attuale, signore."
                        );

                    },

                    500

                );


                return;

            }



            /* =========================================
               CALENDARIO
            ========================================= */

            if(

                t.includes("calendario") ||

                t.includes("appuntamento") ||

                t.includes("agenda")

            ){

                setTimeout(

                    function(){

                        speak(
                            "Sto controllando la sua agenda, signore."
                        );

                    },

                    500

                );


                return;

            }



            /* =========================================
               MEMORIA
            ========================================= */

            if(

                t.includes("ricorda") ||

                t.includes("ricordami") ||

                t.includes("memoria") ||

                t.includes("ricordi")

            ){

                setTimeout(

                    function(){

                        speak(
                            "Sto verificando la memoria, signore."
                        );

                    },

                    500

                );


                return;

            }



            /* =========================================
               RICERCA
            ========================================= */

            if(

                t.includes("cerca") ||

                t.includes("trova") ||

                t.includes("informazioni")

            ){

                setTimeout(

                    function(){

                        speak(
                            "Sto cercando le informazioni richieste, signore."
                        );

                    },

                    500

                );


                return;

            }



            /* =========================================
               GENERALE
            ========================================= */

            setTimeout(

                function(){

                    speak(
                        "Sto elaborando la richiesta, signore."
                    );

                },

                500

            );

        };



    /* =================================================
       ERRORE
    ================================================= */

    recognition.onerror =
        function(event){

            console.log(
                "ERRORE MICROFONO:",
                event.error
            );


            setState(
                "IDLE"
            );


            voiceText.textContent =
                "";

        };



    /* =================================================
       FINE
    ================================================= */

    recognition.onend =
        function(){

            console.log(
                "MICROFONO TERMINATO"
            );


            mic.classList.remove(
                "listening"
            );

        };

}



/* =====================================================
   AVVIO
===================================================== */

function startListening(){

    if(!recognition){

        console.log(
            "Speech Recognition non supportato"
        );

        return;

    }


    try{

        recognition.start();

    }

    catch(error){

        console.log(
            "MICROFONO GIA ATTIVO"
        );

    }

}



/* =====================================================
   CLICK
===================================================== */

mic.addEventListener(

    "click",

    function(){

        startListening();

    }

);



/* =====================================================
   AVVIO
===================================================== */

setState(
    "IDLE"
);


console.log(
    "JARVIS ONLINE"
);

console.log(
    "SpeechRecognition:",
    !!SpeechRecognition
);

</script>


</body>

</html>
