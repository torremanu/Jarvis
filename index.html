<script>

const statusElement = document.getElementById("status");
const voiceElement = document.getElementById("voice");
const mic = document.getElementById("mic");
const neural = document.getElementById("neural");
const clock = document.getElementById("clock");


/* PARTICELLE */

for(let i = 0; i < 40; i++){

    const p = document.createElement("span");

    const angle = Math.random() * Math.PI * 2;
    const radius = 35 + Math.random() * 55;

    p.style.left =
        (50 + Math.cos(angle) * radius / 1.8) + "%";

    p.style.top =
        (50 + Math.sin(angle) * radius / 1.8) + "%";

    neural.appendChild(p);
}


/* OROLOGIO */

function updateClock(){

    const d = new Date();

    const h = String(d.getHours()).padStart(2,"0");
    const m = String(d.getMinutes()).padStart(2,"0");
    const s = String(d.getSeconds()).padStart(2,"0");

    clock.innerHTML =
        h + ":" + m + ":" + s +
        "<br>LOCAL SYSTEM";
}

updateClock();
setInterval(updateClock,1000);


/* STATO */

function setState(text){

    statusElement.textContent = text;
    voiceElement.textContent = text;

    if(text === "LISTENING" ||
       text === "HEARING" ||
       text === "THINKING" ||
       text === "SPEAKING"){

        mic.classList.add("active");

    }else{

        mic.classList.remove("active");
    }
}


/* RICONOSCIMENTO */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let listening = false;


/* VOCE */

function speak(text){

    console.log("JARVIS SPEAK:", text);

    setState("SPEAKING");

    if(!("speechSynthesis" in window)){

        setState("VOICE ERROR");

        alert("La sintesi vocale non è disponibile.");

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = "it-IT";
    utterance.rate = 0.9;
    utterance.pitch = 1;
    utterance.volume = 1;

    utterance.onstart = function(){

        console.log("VOCE AVVIATA");

        setState("SPEAKING");
    };

    utterance.onend = function(){

        console.log("VOCE TERMINATA");

        setState("SYSTEM READY");
    };

    utterance.onerror = function(event){

        console.log("ERRORE VOCE:", event);

        setState("VOICE ERROR");
    };

    speechSynthesis.speak(utterance);
}


/* ASCOLTO */

function startListening(){

    console.log("PULSANTE JARVIS PREMUTO");

    if(listening){
        return;
    }

    if(!SpeechRecognition){

        setState("VOICE ERROR");

        alert(
            "Il browser non supporta il riconoscimento vocale."
        );

        return;
    }


    recognition =
        new SpeechRecognition();

    recognition.lang = "it-IT";

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;


    /* PARTENZA */

    recognition.onstart = function(){

        console.log("MICROFONO ATTIVO");

        listening = true;

        setState("LISTENING");
    };


    /* AUDIO */

    recognition.onaudiostart = function(){

        console.log("AUDIO RICEVUTO");

        setState("HEARING");
    };


    /* PARLATO */

    recognition.onspeechstart = function(){

        console.log("PARLATO RILEVATO");

        setState("LISTENING");
    };


    /* RISULTATO */

    recognition.onresult = function(event){

        console.log("RISULTATO RICEVUTO");

        const testo =
            event.results[0][0].transcript;

        console.log("TESTO:", testo);

        listening = false;

        setState("THINKING");

        setTimeout(function(){

            speak(
                "Ho capito: " + testo
            );

        },500);
    };


    /* NESSUN RISULTATO */

    recognition.onnomatch = function(){

        console.log("NESSUN RISULTATO");

        listening = false;

        setState("NO COMMAND");

        setTimeout(function(){

            setState("SYSTEM READY");

        },2000);
    };


    /* ERRORE */

    recognition.onerror = function(event){

        console.log(
            "ERRORE RICONOSCIMENTO:",
            event.error
        );

        listening = false;

        setState(
            "ERROR " + event.error.toUpperCase()
        );

        setTimeout(function(){

            setState("SYSTEM READY");

        },3000);
    };


    /* FINE */

    recognition.onend = function(){

        console.log("ASCOLTO TERMINATO");

        listening = false;

        mic.classList.remove("active");
    };


    /* AVVIO */

    try{

        recognition.start();

    }catch(error){

        console.log(
            "ERRORE START:",
            error
        );

        listening = false;

        setState("START ERROR");
    }
}


/* PULSANTE */

mic.addEventListener(
    "click",
    startListening
);


/* STATO INIZIALE */

setState("SYSTEM READY");

</script>
